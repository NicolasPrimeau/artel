repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Surfaces prose pages whose subject code changed in this commit. Never blocks:
  # you are told, and you decide whether the page still reads true.
  - repo: local
    hooks:
      - id: docs-freshness
        name: docs describe current code
        entry: bash -c 'python3 scripts/check_docs.py || true'
        language: system
        pass_filenames: false
        verbose: true
        always_run: true
        stages: [pre-commit]
