<!doctype html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Artel ledger</title>
<style>
/* Instrument panel. Full-bleed, dense, monospace throughout — this is a readout, not
   a document. Warm-dark rather than the usual cold slate; amber for money because it
   is the only hue that appears, so a figure never has to be labelled to be found.
   Every table scrolls inside its own gutter: the failure before was a 76ch column
   with 7-column tables in it. */
:root{
  --bg:#14120f; --panel:#1b1815; --row:#1f1c18;
  --fg:#e8e2d8; --dim:#9a9086; --rule:#332e28; --edge:#6d6357;
  --money:#e0a458; --warn:#d1705a; --ok:#8bab6d;
  --mono:"SF Mono",ui-monospace,"JetBrains Mono","Roboto Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--mono);
  font-variant-numeric:tabular-nums lining-nums;overflow-y:scroll}

/* ---- top bar: identity left, window control right, KPIs beneath ---- */
.bar{display:flex;align-items:center;gap:16px;padding:10px 16px;
  border-bottom:1px solid var(--rule);background:var(--panel);
  position:sticky;top:0;z-index:5}
.brand{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.brand i{color:var(--money);font-style:normal}
.spacer{flex:1}
.seg{display:flex;border:1px solid var(--edge)}
.seg button{background:transparent;border:0;border-right:1px solid var(--edge);
  color:var(--dim);font:11px/1 var(--mono);padding:6px 10px;cursor:pointer;
  letter-spacing:.08em}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--money);color:#14120f;font-weight:700}
.stamp{font-size:10px;color:var(--dim);letter-spacing:.06em}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border-bottom:1px solid var(--rule)}
.kpi{padding:12px 16px;border-right:1px solid var(--rule)}
.kpi:last-child{border-right:0}
.kpi .k{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.kpi .v{font-size:22px;line-height:1.15;margin-top:3px}
.kpi .v.money{color:var(--money)}
.kpi .sub{font-size:10px;color:var(--dim);margin-top:2px}

/* ---- panels ---- */
main{display:grid;grid-template-columns:1fr;gap:0}
section{border-bottom:1px solid var(--rule)}
h2{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  font-weight:400;padding:9px 16px;border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:10px;background:var(--panel)}
h2 .count{color:var(--edge)}
h2 .clear{margin-left:auto;color:var(--money);cursor:pointer;text-transform:none;
  letter-spacing:0}

.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap;min-width:640px}
th{position:sticky;top:0;text-align:left;font-weight:400;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--rule)}
td{padding:6px 12px;border-bottom:1px solid var(--rule)}
tbody tr:nth-child(even){background:var(--row)}
tbody tr:hover{background:#26221d}
td.n,th.n{text-align:right}
td.money{color:var(--money)}
td.dim,.dim{color:var(--dim)}
td.name{cursor:pointer}
td.name:hover{color:var(--money)}
tr.sel td{background:#2b2620;box-shadow:inset 2px 0 0 var(--money)}
.bar-cell{display:block;height:3px;background:var(--money);opacity:.55;margin-top:4px}

/* ---- decisions: list, not prose ---- */
.dec{padding:10px 16px;border-bottom:1px solid var(--rule);display:grid;
  grid-template-columns:1fr 120px;gap:12px;align-items:start}
.dec:nth-child(even){background:var(--row)}
.dec .txt{min-width:0}
.dec .what{font-size:13px;overflow-wrap:anywhere}
.dec .why{color:var(--dim);font-size:11px;margin-top:3px;overflow-wrap:anywhere}
.dec .meta{font-size:10px;color:var(--edge);margin-top:5px;letter-spacing:.05em}
.dec .rej{color:var(--warn)}
.dec .cost{text-align:right;color:var(--money);font-size:13px}
.dec .cost small{display:block;color:var(--dim);font-size:10px;letter-spacing:.05em}
.empty{padding:16px;color:var(--dim);font-size:11px}
footer{padding:10px 16px;color:var(--edge);font-size:10px;letter-spacing:.05em}
</style>

<div class=bar>
  <span class=brand>artel <i>ledger</i></span>
  <span class=stamp id=stamp></span>
  <span class=spacer></span>
  <span class=seg id=seg></span>
</div>

<div class=kpis id=kpis></div>

<main>
  <section><h2>Projects <span class=count id=pc></span>
    <span class=clear id=clr hidden onclick="pick(null)">clear filter ×</span></h2>
    <div class=scroll id=projects></div></section>
  <section><h2>Sessions <span class=count id=sc></span></h2>
    <div class=scroll id=sessions></div></section>
  <section><h2>Decisions <span class=count id=dc></span></h2>
    <div id=decisions></div></section>
</main>
<footer id=foot></footer>

<script>
let DAYS=30, SEL=null;
const esc=t=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const n=v=>(v||0).toLocaleString('en-US');
const usd=v=>v==null?null:'$'+Math.round(v).toLocaleString('en-US');

function seg(){document.getElementById('seg').innerHTML=[7,30,90]
  .map(d=>`<button class="${d===DAYS?'on':''}" onclick="setDays(${d})">${d}d</button>`).join('')}
function setDays(d){DAYS=d;seg();load()}
function pick(p){SEL=(SEL===p?null:p);document.getElementById('clr').hidden=!SEL;load()}

async function load(){
  const [proj,sess,dec]=await Promise.all([
    fetch(`/api/projects?days=${DAYS}`).then(r=>r.json()),
    fetch(`/api/sessions?days=${DAYS}&limit=60`).then(r=>r.json()),
    fetch(`/api/decisions?days=${DAYS}&limit=60`).then(r=>r.json())]);
  const t=proj.totals;

  document.getElementById('kpis').innerHTML=`
    <div class=kpi><div class=k>Value of work</div><div class="v money">${usd(t.equivalent)||'—'}</div>
      <div class=sub>list-price equivalent</div></div>
    <div class=kpi><div class=k>Billed</div><div class=v>${usd(t.billed)}</div>
      <div class=sub>metered, actually invoiced</div></div>
    <div class=kpi><div class=k>Sessions</div><div class=v>${n(t.sessions)}</div>
      <div class=sub>${n(proj.rows.reduce((a,r)=>a+r.turns,0))} turns</div></div>
    <div class=kpi><div class=k>Decisions</div><div class=v>${n(t.decisions)}</div>
      <div class=sub>mined from captures</div></div>`;

  const max=Math.max(...proj.rows.map(r=>r.equivalent||0),1);
  document.getElementById('pc').textContent=proj.rows.length;
  document.getElementById('projects').innerHTML=`<table><thead><tr>
    <th>Project</th><th class=n>Sessions</th><th class=n>Turns</th><th class=n>Output</th>
    <th class=n>Cache read</th><th class=n>Decisions</th><th class=n>Value</th></tr></thead><tbody>`+
    proj.rows.map(r=>`<tr class="${SEL===r.project?'sel':''}">
      <td class=name onclick="pick('${r.project}')">${esc(r.project)}</td>
      <td class=n>${n(r.sessions)}</td><td class=n>${n(r.turns)}</td>
      <td class=n>${n(r.output_tokens)}</td><td class="n dim">${n(r.cache_read)}</td>
      <td class=n>${r.decisions||'<span class=dim>0</span>'}</td>
      <td class="n money">${usd(r.equivalent||r.billed)}
        <span class=bar-cell style="width:${Math.max(4,(r.equivalent/max)*100)}%"></span></td>
    </tr>`).join('')+`</tbody></table>`;

  const srows=sess.rows.filter(r=>!SEL||r.project===SEL);
  document.getElementById('sc').textContent=srows.length;
  document.getElementById('sessions').innerHTML=srows.length?`<table><thead><tr>
    <th>Session</th><th>Project</th><th>Model</th><th class=n>Turns</th>
    <th class=n>Output</th><th class=n>Cost</th></tr></thead><tbody>`+
    srows.slice(0,40).map(r=>`<tr><td>${esc((r.session_id||'').slice(0,8))}</td>
      <td>${esc(r.project)}</td><td class=dim>${esc(r.model)}</td>
      <td class=n>${n(r.turns)}</td><td class=n>${n(r.output_tokens)}</td>
      <td class="n ${r.cost?.amount!=null?'money':'dim'}">${usd(r.cost?.amount)||'not priced'}</td>
    </tr>`).join('')+`</tbody></table>`:`<p class=empty>No sessions in window.</p>`;

  const drows=dec.rows.filter(r=>!SEL||r.project===SEL);
  document.getElementById('dc').textContent=drows.length;
  document.getElementById('decisions').innerHTML=drows.length?drows.map(r=>`
    <div class=dec>
      <div class=txt>
        <div class=what>${esc(r.decision)}</div>
        ${r.rationale?`<div class=why>${esc(r.rationale)}</div>`:''}
        <div class=meta>${esc(r.project||'unscoped')} · ${esc((r.created_at||'').slice(0,10))}
          · ${esc((r.session_id||'—').slice(0,8))}
          ${r.alternatives?.length?`· <span class=rej>rejected ${r.alternatives.map(esc).join(', ')}</span>`:''}</div>
      </div>
      <div class=cost>${usd(r.session_cost)||'<span class=dim>—</span>'}<small>session total</small></div>
    </div>`).join(''):`<p class=empty>Nothing on record. The archivist mines these from captures.</p>`;

  document.getElementById('stamp').textContent=new Date().toLocaleTimeString('en-GB');
  document.getElementById('foot').textContent=
    `Figures computed from the store, never generated · decision cost is the whole session that produced it, not divided between decisions · refreshes every 30s`
    + (t.unpriced.length?` · unpriced models: ${t.unpriced.join(', ')}`:'');
}
seg(); load(); setInterval(load,30000);
</script>
