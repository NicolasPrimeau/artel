services:
  archivist:
    volumes:
      - artel-data:/data
    environment:
      - DB_PATH=/data/artel.db
      # OpenRouter, so which model does the curating is a setting rather than a
      # build. OPENROUTER_API_KEY comes from .env; the model is the provider default
      # (google/gemini-3.7-flash) unless ARCHIVIST_MODEL says otherwise.
      - ARCHIVIST_PROVIDER=openrouter
      - ARCHIVIST_MODEL=
      # This service IS the archivist; the entrypoint must not also inline-spawn one.
      - RUN_INLINE_ARCHIVIST=0
      # Blank the Anthropic key so a stale value can't quietly bill pay-as-you-go if
      # the provider is ever switched back.
      - ANTHROPIC_API_KEY=

  artel:
    environment:
      # A dedicated archivist service runs the curator; stop the server entrypoint
      # from spawning a second one. RUN_INLINE_ARCHIVIST is honored by guarded images;
      # blanking the key also suppresses the spawn on older images and keeps pay-as-you-go
      # billing off the server (the archivist bills the SDK credit via its own service).
      - RUN_INLINE_ARCHIVIST=0
      - ANTHROPIC_API_KEY=

  watchtower: {}
